baseURL = '/'
locale = 'en-US'
title = 'Castor Documentation'

theme = 'hugo-geekdoc'
relativeURLs = true

pygmentsUseClasses = true
pygmentsCodeFences = true
disablePathToLower = true
enableRobotsTXT = true
pluralizeListTitles = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

[params]
  geekdocRepo = 'https://github.com/retail-cortex/castor'
  geekdocEditPath = 'edit/main/docs/content'
  geekdocSearch = true

